<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / circle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- White Geo-Pin Symbol -->
  <g filter="url(#shadow)">
    <!-- Pin outer path -->
    <path d="M256 70 C162 70 86 146 86 240 C86 345 230 442 245 452 C251 456 261 456 267 452 C282 442 426 345 426 240 C426 146 350 70 256 70 Z" fill="url(#accent-grad)" />
    
    <!-- Red Inner Core -->
    <circle cx="256" cy="225" r="95" fill="#dc2626" />
    
    <!-- Education / Compass / Map Motif -->
    <!-- Graduation Cap / School Roof icon -->
    <path d="M256 168 L190 202 L256 236 L322 202 Z" fill="#ffffff" />
    <!-- Cap base & tassel -->
    <path d="M205 212 L205 242 C205 258 228 268 256 268 C284 268 307 258 307 242 L307 212 L256 238 Z" fill="#f8fafc" />
    <path d="M312 203 L328 225 L328 255 L322 255 L322 230 Z" fill="#fef08a" />
    <!-- GIS Compass coordinates ring -->
    <circle cx="256" cy="225" r="68" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="4 4" />
  </g>

  <!-- Banner badge "SMKN 1 SONGGOM" -->
  <rect x="76" y="420" width="360" height="48" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="256" y="452" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="21" fill="#dc2626" letter-spacing="1">GIS PKL • SMKN 1 SONGGOM</text>
</svg>
